<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Watch</title>
    <link rel="icon" href="https://static.vecteezy.com/system/resources/thumbnails/035/321/929/small/limited-time-offer-deadline-symbol-stopwatch-3d-rendering-icon-illustration-isolated-png.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="stopwatch">
        <h1 id="display">00:00:00:00</h1>
        <div class="btns">
            <button onclick="start()" id="start">Start</button>
            <button onclick="stop_time()" id="stop">Stop</button>
            <button onclick="reset_time()" id="reset">Reset</button>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
